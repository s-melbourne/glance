<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="format-detection" content="telephone=no">
  <title>Glance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .safe-x {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .scrollbar-thin::-webkit-scrollbar { width: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }
    .filter-fade { transition: opacity 260ms ease, transform 260ms ease; }
    .filter-fade.is-dimmed { opacity: 0.15; transform: scale(0.98); pointer-events: none; }
    .month-grid-8 {
      display: grid;
      grid-template-columns: minmax(3.5rem, 5rem) repeat(7, minmax(0, 1fr));
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .rise-in { animation: rise-in 340ms ease both; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.92); }
    }
    .status-pulse { animation: pulse-dot 2.4s ease-in-out infinite; }
    @keyframes hub-tap {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.82; }
      100% { transform: scale(1); opacity: 1; }
    }
    .hub-tap-flash { animation: hub-tap 200ms ease-out; }
    @keyframes iosPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    .clock-colon {
      animation: iosPulse 1s infinite ease-in-out;
      display: inline-block;
    }
    #ios-clock {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    }
  </style>
</head>
<body class="bg-white text-zinc-900 antialiased">

  <div id="app-shell" class="flex h-screen w-screen overflow-hidden bg-white safe-top safe-x">

    <!-- Ultra-slim navigation rail (desktop / tablet) -->
    <nav id="nav-rail" class="hidden sm:flex w-20 h-full shrink-0 bg-[#F2F2F7]/60 backdrop-blur-md border-r border-zinc-200/50 flex-col justify-between items-center py-6 z-50" aria-label="Primary navigation">
      <div class="flex flex-col items-center gap-6">
        <button type="button" id="system-hub-dot" onclick="resetDashboard()"
          class="touch-target w-9 h-9 rounded-2xl bg-gradient-to-br from-zinc-800 to-zinc-600 flex items-center justify-center shadow-[0_8px_32px_rgba(0,0,0,0.08)] hover:scale-105 active:scale-95 transition-transform"
          aria-label="Home — reset dashboard" title="Home">
          <span class="w-2 h-2 rounded-full bg-white status-pulse pointer-events-none"></span>
        </button>
        <div class="flex flex-col items-center gap-2">
          <button type="button" data-nav="week" class="nav-btn touch-target p-3 rounded-2xl text-zinc-400 hover:text-zinc-800 transition-colors" aria-label="Week view" title="Week">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
          </button>
          <button type="button" data-nav="day" class="nav-btn touch-target p-3 rounded-2xl text-zinc-400 hover:text-zinc-800 transition-colors" aria-label="Today view" title="Today">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
          </button>
          <button type="button" data-nav="month" class="nav-btn touch-target p-3 rounded-2xl text-zinc-400 hover:text-zinc-800 transition-colors" aria-label="Month view" title="Month">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </button>
        </div>
      </div>
      <div class="flex flex-col items-center gap-3">
        <button type="button" id="btn-sync" class="touch-target p-3 rounded-2xl text-zinc-400 hover:text-zinc-800 transition-colors" aria-label="Refresh calendar" title="Refresh">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
        <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-400 status-pulse" title="Operational"></span>
      </div>
    </nav>

    <!-- Family filter column -->
    <aside id="family-rail" class="hidden sm:flex w-14 shrink-0 flex-col items-center gap-3 py-8 border-r border-zinc-100 bg-white" aria-label="Family filters"></aside>

    <!-- Main canvas -->
    <main id="main-content" class="flex-1 min-w-0 h-full flex flex-col bg-white overflow-hidden safe-bottom">

      <header id="main-header" class="shrink-0 flex justify-between items-baseline gap-8 pt-8 px-8 pb-4 bg-white border-b border-zinc-100">
        <button type="button" id="btn-month-header" class="text-left group min-w-0 flex-1">
          <p id="header-eyebrow" class="text-[11px] font-semibold uppercase tracking-[0.14em] text-zinc-400 mb-1">Week</p>
          <h1 id="header-title" class="text-3xl sm:text-4xl font-bold tracking-tight text-zinc-900 leading-none group-hover:text-zinc-600 transition-colors">June</h1>
        </button>
        <div id="ios-clock-wrapper" class="shrink-0 flex flex-col items-end pl-2">
          <div id="ios-clock" class="text-5xl md:text-6xl font-light tracking-tight text-zinc-400/90 tabular-nums antialiased selection:bg-transparent leading-none select-none" aria-live="polite">00<span class="clock-colon mx-0.5">:</span>00</div>
          <p id="last-updated" class="text-[11px] font-medium text-zinc-400 tracking-wide mt-2">Last updated —</p>
        </div>
      </header>

      <!-- VIEW 1: Masonry Week Hub -->
      <section id="view-week" class="view-panel flex flex-col flex-1 min-h-0">
        <div id="week-columns" class="flex-1 min-h-0 grid grid-cols-7 h-full divide-x divide-zinc-100 bg-white overflow-hidden"></div>
      </section>

      <!-- VIEW 2: Today List -->
      <section id="view-day" class="view-panel hidden flex-col flex-1 min-h-0">
        <div class="shrink-0 flex items-center justify-between gap-4 px-8 py-3 border-b border-zinc-100">
          <div id="family-mobile" class="flex sm:hidden gap-2 overflow-x-auto pb-0.5"></div>
          <div class="hidden sm:block flex-1"></div>
          <button type="button" id="btn-back-week" class="touch-target shrink-0 px-4 py-2 rounded-2xl text-[13px] font-semibold text-zinc-500 border border-zinc-100 shadow-[0_8px_32px_rgba(0,0,0,0.02)] hover:bg-zinc-50 transition-colors">Week</button>
        </div>
        <div id="day-timeline" class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-8 py-8 space-y-4"></div>
      </section>

      <!-- VIEW 3: Month Matrix -->
      <section id="view-month" class="view-panel hidden flex-col flex-1 min-h-0">
        <div class="shrink-0 flex items-center justify-between gap-4 px-8 py-3 border-b border-zinc-100">
          <div id="month-ribbon" class="flex flex-1 gap-2 overflow-x-auto scrollbar-thin pb-0.5"></div>
          <button type="button" id="btn-clear-filters" class="touch-target shrink-0 px-4 py-2 rounded-2xl text-[13px] font-semibold text-zinc-500 border border-zinc-100 hover:bg-zinc-50 transition-colors">Clear</button>
        </div>
        <div class="flex-1 min-h-0 overflow-auto">
          <div id="month-grid" class="month-grid-8 gap-3 p-6 h-full min-w-[640px] bg-white"></div>
        </div>
      </section>

      <!-- Mobile bottom navigation -->
      <nav id="nav-mobile" class="sm:hidden shrink-0 flex items-center justify-around px-4 py-3 border-t border-zinc-100 bg-[#F2F2F7]/80 backdrop-blur-md" aria-label="Mobile navigation">
        <button type="button" data-nav="week" class="nav-btn-mobile touch-target p-3 rounded-2xl text-zinc-400" aria-label="Week">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>
        </button>
        <button type="button" data-nav="day" class="nav-btn-mobile touch-target p-3 rounded-2xl text-zinc-400" aria-label="Today">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        </button>
        <button type="button" data-nav="month" class="nav-btn-mobile touch-target p-3 rounded-2xl text-zinc-400" aria-label="Month">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
        <button type="button" id="btn-sync-mobile" class="touch-target p-3 rounded-2xl text-zinc-400" aria-label="Refresh">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        </button>
      </nav>
    </main>
  </div>

  <script>
    const ICLOUD_URL = "YOUR_HTTPS_ICLOUD_LINK_HERE";

    const USERS = [
      { id: 'anna',     name: 'Anna',     keywords: ['anna'],     initial: 'A', pastel: 'bg-pink-100',   ribbon: 'border-l-pink-400',   dash: 'bg-pink-400',   ring: 'ring-pink-400',   avatar: 'bg-pink-100 text-pink-600' },
      { id: 'simeon',   name: 'Simeon',   keywords: ['simeon'],   initial: 'S', pastel: 'bg-blue-100',   ribbon: 'border-l-blue-400',   dash: 'bg-blue-400',   ring: 'ring-blue-400',   avatar: 'bg-blue-100 text-blue-600' },
      { id: 'tennille', name: 'Tennille', keywords: ['tennille'], initial: 'T', pastel: 'bg-emerald-100', ribbon: 'border-l-emerald-400', dash: 'bg-emerald-400', ring: 'ring-emerald-400', avatar: 'bg-emerald-100 text-emerald-600' },
      { id: 'bibi',     name: 'Bibi',     keywords: ['bibi'],     initial: 'B', pastel: 'bg-purple-100', ribbon: 'border-l-purple-400', dash: 'bg-purple-400', ring: 'ring-purple-400', avatar: 'bg-purple-100 text-purple-600' },
    ];

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTH_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const SYNC_INTERVAL_MS = 15 * 60 * 1000;

    let events = [];
    let state = {
      view: 'week',
      selectedDate: startOfDay(new Date()),
      selectedMonth: new Date().getMonth(),
      selectedYear: new Date().getFullYear(),
      filteredUser: null,
      weekStartDate: startOfDay(new Date()),
      anchoredFromMonth: false,
    };

    let syncTimer = null;
    let midnightTimer = null;
    const eventRsvp = {};

    function makeEventId(summary, start, uid) {
      if (uid) return String(uid).replace(/'/g, '');
      return `evt-${start.getTime()}-${summary.replace(/\s+/g, '-').slice(0, 24)}`;
    }

    function jsQuote(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function ensureEventIds(list) {
      list.forEach((e, i) => {
        if (!e.id) e.id = makeEventId(e.summary, e.start, null) + '-' + i;
      });
      return list;
    }

    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() &&
             a.getMonth() === b.getMonth() &&
             a.getDate() === b.getDate();
    }

    function dateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return startOfDay(x);
    }

    function formatTimeReadable(d) {
      const h = d.getHours() % 12 || 12;
      const m = d.getMinutes();
      const suffix = d.getHours() >= 12 ? 'PM' : 'AM';
      return m === 0 ? `${h} ${suffix}` : `${h}:${String(m).padStart(2, '0')} ${suffix}`;
    }

    function getRollingDays(startDate) {
      return Array.from({ length: 7 }, (_, i) => addDays(startDate, i));
    }

    function getMondayOfWeek(d) {
      const x = startOfDay(d);
      const day = x.getDay();
      return addDays(x, day === 0 ? -6 : 1 - day);
    }

    function matchUser(text) {
      const lower = (text || '').toLowerCase();
      for (const user of USERS) {
        if (user.keywords.some(kw => lower.includes(kw))) return user;
      }
      return null;
    }

    function parseICalEvents(icalData) {
      const jcal = ICAL.parse(icalData);
      const comp = new ICAL.Component(jcal);
      const parsed = [];

      for (const vevent of comp.getAllSubcomponents('vevent')) {
        const event = new ICAL.Event(vevent);
        const summary = event.summary || 'Untitled';
        const start = event.startDate.toJSDate();
        const end = event.endDate ? event.endDate.toJSDate() : new Date(start.getTime() + 3600000);
        const user = matchUser(summary);

        const uid = event.uid || vevent.getFirstPropertyValue('uid');

        if (event.startDate.isDate) {
          let cursor = startOfDay(start);
          const last = startOfDay(end);
          let dayIdx = 0;
          while (cursor < last) {
            parsed.push({
              id: makeEventId(summary, cursor, uid) + '-allday-' + dayIdx,
              summary, start: new Date(cursor), end: addDays(cursor, 1), user, allDay: true,
            });
            cursor = addDays(cursor, 1);
            dayIdx++;
          }
        } else {
          parsed.push({
            id: makeEventId(summary, start, uid),
            summary, start, end, user, allDay: false,
          });
        }
      }
      return parsed;
    }

    function getEventsForDay(day) {
      const key = dateKey(day);
      return events
        .filter(e => {
          if (dateKey(startOfDay(e.start)) !== key) return false;
          if (state.filteredUser && (!e.user || e.user.id !== state.filteredUser)) return false;
          return true;
        })
        .sort((a, b) => a.start - b.start);
    }

    function stripUserPrefix(summary) {
      let s = summary;
      for (const u of USERS) {
        for (const kw of u.keywords) {
          s = s.replace(new RegExp(kw, 'gi'), '').trim();
        }
      }
      return s.replace(/^[-:,\s]+/, '').trim() || summary;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function isEventDimmed(event) {
      return state.filteredUser && (!event.user || event.user.id !== state.filteredUser);
    }

    function eventActionsHTML(eventId) {
      const rsvp = eventRsvp[eventId] || {};
      const accepted = !!rsvp.accepted;
      const queryPending = !!rsvp.queryPending;
      const visibility = accepted || queryPending
        ? 'opacity-100'
        : 'opacity-0 group-hover:opacity-100 group-focus-within:opacity-100';
      const acceptClass = accepted ? 'text-emerald-500' : 'text-zinc-300 hover:text-emerald-500';
      const queryClass = queryPending ? 'text-amber-500' : 'text-zinc-300 hover:text-amber-500';
      const safeId = jsQuote(eventId);

      return `
        <div class="event-actions flex items-center gap-3 mr-3 ${visibility} transition-opacity duration-200">
          <button type="button" onclick="acceptEvent(event, '${safeId}')" class="p-1 rounded-full hover:bg-emerald-50 ${acceptClass} transition-colors" title="Accept event">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button type="button" onclick="queryEvent(event, '${safeId}')" class="relative p-1 rounded-full hover:bg-amber-50 ${queryClass} transition-colors" title="Ask a question">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            ${queryPending ? '<span class="absolute -top-0.5 -right-0.5 w-2 h-2 rounded-full bg-amber-500 ring-2 ring-white" aria-hidden="true"></span>' : ''}
          </button>
        </div>`;
    }

    function eventBadgeRowHTML(event, u, size = 'sm', showActions = true) {
      const avatar = size === 'lg'
        ? 'w-8 h-8 text-[12px]'
        : 'w-7 h-7 text-[11px]';
      const pos = size === 'lg' ? 'right-4 top-4' : 'right-2.5 top-2.5';

      return `
        <div class="absolute ${pos} flex items-center">
          ${showActions ? eventActionsHTML(event.id) : ''}
          <span class="${avatar} rounded-full flex items-center justify-center font-bold shrink-0 ${u.avatar}">${u.initial}</span>
        </div>`;
    }

    function ticketHTML(event, compact = true, showActions = true) {
      const user = event.user;
      const u = user || { pastel: 'bg-zinc-100', ribbon: 'border-l-zinc-300', avatar: 'bg-zinc-100 text-zinc-500', initial: '?' };
      const timeStr = event.allDay ? 'All day' : formatTimeReadable(event.start);
      const label = stripUserPrefix(event.summary);
      const dimmed = isEventDimmed(event) ? 'is-dimmed' : '';
      const pad = compact
        ? (showActions ? 'p-3 pr-[5.5rem]' : 'p-3 pr-11')
        : (showActions ? 'p-5 pr-[6.5rem]' : 'p-5 pr-14');

      return `
        <div class="${showActions ? 'group ' : ''}filter-fade ${dimmed} relative ${pad} rounded-2xl border border-zinc-100 border-l-4 ${u.ribbon} ${u.pastel} bg-opacity-40 shadow-[0_8px_32px_rgba(0,0,0,0.02)]">
          <p class="text-[14px] font-bold text-zinc-900 tracking-tight leading-snug truncate">${escapeHtml(label)}</p>
          <p class="text-[11px] text-zinc-500 font-medium mt-1">${timeStr}</p>
          ${eventBadgeRowHTML(event, u, compact ? 'sm' : 'lg', showActions)}
        </div>`;
    }

    async function fetchCalendarData() {
      const dot = document.getElementById('status-dot');
      if (!ICLOUD_URL || ICLOUD_URL === 'YOUR_HTTPS_ICLOUD_LINK_HERE') {
        updateLastSynced(null, 'Set ICLOUD_URL to sync');
        if (dot) { dot.className = 'w-2 h-2 rounded-full bg-amber-400 status-pulse'; }
        return;
      }
      try {
        const response = await fetch('https://corsproxy.io/?url=' + encodeURIComponent(ICLOUD_URL));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        events = ensureEventIds(parseICalEvents(await response.text()));
        updateLastSynced(new Date());
        if (dot) { dot.className = 'w-2 h-2 rounded-full bg-emerald-400 status-pulse'; }
        renderCurrentView();
      } catch (err) {
        console.error('Calendar sync failed:', err);
        updateLastSynced(null, 'Sync failed');
        if (dot) { dot.className = 'w-2 h-2 rounded-full bg-red-400 status-pulse'; }
      }
    }

    function updateLastSynced(date, overrideText) {
      const el = document.getElementById('last-updated');
      if (!el) return;
      el.textContent = overrideText || (date
        ? `Updated ${date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
        : 'Last updated —');
    }

    function updateMainHeader(eyebrow, title, titleClickable = false) {
      document.getElementById('header-eyebrow').textContent = eyebrow;
      document.getElementById('header-title').textContent = title;
      const wrap = document.getElementById('btn-month-header');
      wrap.classList.toggle('group', titleClickable);
      wrap.classList.toggle('pointer-events-none', !titleClickable);
    }

    function startClock() {
      const clockEl = document.getElementById('ios-clock');
      function update() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        clockEl.innerHTML = `${hours}<span class="clock-colon mx-0.5">:</span>${minutes}`;
      }
      update();
      setInterval(update, 1000);
    }

    function startSyncLoop() {
      fetchCalendarData();
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(fetchCalendarData, SYNC_INTERVAL_MS);
    }

    function scheduleMidnightRollover() {
      if (midnightTimer) clearTimeout(midnightTimer);
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(0, 0, 1, 0);
      midnightTimer = setTimeout(() => {
        if (!state.anchoredFromMonth) state.weekStartDate = startOfDay(new Date());
        state.selectedDate = startOfDay(new Date());
        renderCurrentView();
        scheduleMidnightRollover();
      }, tomorrow - new Date());
    }

    function showView(name) {
      state.view = name;
      document.querySelectorAll('.view-panel').forEach(el => {
        el.classList.add('hidden');
        el.classList.remove('flex');
      });
      const target = document.getElementById(`view-${name}`);
      if (target) {
        target.classList.remove('hidden');
        target.classList.add('flex');
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      if (state.view === 'week') renderWeekView();
      else if (state.view === 'day') renderDayView();
      else if (state.view === 'month') renderMonthView();
      renderNavigation();
      renderFamilyFilters();
    }

    function renderNavigation() {
      const activeClass = 'bg-zinc-900 text-white shadow-sm';
      const inactiveClass = 'text-zinc-400 hover:text-zinc-800';

      document.querySelectorAll('.nav-btn, .nav-btn-mobile').forEach(btn => {
        const isActive = btn.dataset.nav === state.view;
        btn.className = btn.className
          .replace(/bg-zinc-900|text-white|shadow-sm/g, '')
          .replace(/text-zinc-400|hover:text-zinc-800/g, '');
        const base = btn.classList.contains('nav-btn-mobile')
          ? 'nav-btn-mobile touch-target p-3 rounded-2xl transition-colors'
          : 'nav-btn touch-target p-3 rounded-2xl transition-colors';
        btn.className = `${base} ${isActive ? activeClass : inactiveClass}`;
      });
    }

    function familyPillHTML(user, size = 'md') {
      const active = state.filteredUser === user.id;
      const dim = size === 'sm' ? 'w-9 h-9 text-[11px]' : 'w-10 h-10 text-[12px]';
      return `
        <button type="button" data-user-filter="${user.id}" title="${user.name}"
          class="touch-target ${dim} rounded-full flex items-center justify-center font-bold ${user.avatar}
            border border-zinc-100 shadow-[0_8px_32px_rgba(0,0,0,0.02)] transition-all
            ${active ? `ring-2 ring-offset-2 ${user.ring} scale-105` : 'opacity-80 hover:opacity-100 hover:scale-105'}">
          ${user.initial}
        </button>`;
    }

    function renderFamilyFilters() {
      const rail = document.getElementById('family-rail');
      if (rail) {
        rail.innerHTML = USERS.map(u => familyPillHTML(u)).join('');
        bindUserFilters(rail);
      }
      const mobile = document.getElementById('family-mobile');
      if (mobile) {
        mobile.innerHTML = USERS.map(u => familyPillHTML(u, 'sm')).join('');
        bindUserFilters(mobile);
      }
    }

    function bindUserFilters(container) {
      container.querySelectorAll('[data-user-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.userFilter;
          state.filteredUser = state.filteredUser === id ? null : id;
          renderCurrentView();
        });
      });
    }

    function clearFilters() {
      state.filteredUser = null;
      state.anchoredFromMonth = false;
      state.weekStartDate = startOfDay(new Date());
      renderCurrentView();
    }

    function resetDashboard() {
      const hub = document.getElementById('system-hub-dot');
      if (hub) {
        hub.classList.remove('hub-tap-flash');
        void hub.offsetWidth;
        hub.classList.add('hub-tap-flash');
        setTimeout(() => hub.classList.remove('hub-tap-flash'), 200);
      }

      state.filteredUser = null;
      state.anchoredFromMonth = false;
      state.weekStartDate = startOfDay(new Date());
      state.selectedDate = startOfDay(new Date());
      showView('week');
    }

    function renderWeekView() {
      const days = getRollingDays(state.weekStartDate);
      const today = new Date();
      updateMainHeader('Week', MONTH_NAMES[days[0].getMonth()], true);

      document.getElementById('week-columns').innerHTML = days.map(day => {
        const isToday = isSameDay(day, today);
        const dayEvents = getEventsForDay(day);

        return `
          <div class="flex flex-col min-h-0 min-w-0">
            <div class="shrink-0 px-3 pt-5 pb-4 text-center">
              <button type="button" data-day-link="${dateKey(day)}" class="inline-block">
                ${isToday
                  ? `<span class="inline-block bg-zinc-900 text-white px-4 py-2.5 rounded-xl font-bold shadow-sm">
                       <span class="block text-[10px] font-medium text-white/60 tracking-wide">${DAY_SHORT[day.getDay()]}</span>
                       <span class="block text-[15px] tracking-tight">${day.getDate()}</span>
                     </span>`
                  : `<span class="inline-block px-2 py-1">
                       <span class="block text-[10px] font-medium text-zinc-400 tracking-wide">${DAY_SHORT[day.getDay()]}</span>
                       <span class="block text-[15px] font-bold text-zinc-900 tracking-tight">${day.getDate()}</span>
                     </span>`}
              </button>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto scrollbar-thin px-3 pb-6 space-y-2.5">
              ${dayEvents.length
                ? dayEvents.map(e => ticketHTML(e, true, false)).join('')
                : '<p class="text-center text-[11px] text-zinc-300 font-medium py-12">—</p>'}
            </div>
          </div>`;
      }).join('');

      bindDayLinks(document.getElementById('week-columns'));
    }

    function bindDayLinks(container) {
      container.querySelectorAll('[data-day-link]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [y, m, d] = btn.dataset.dayLink.split('-').map(Number);
          state.selectedDate = new Date(y, m - 1, d);
          showView('day');
        });
      });
    }

    function renderDayView() {
      const day = state.selectedDate;
      updateMainHeader(
        'Schedule',
        `${DAY_NAMES[day.getDay()]}, ${MONTH_NAMES[day.getMonth()]} ${day.getDate()}`,
        false
      );

      const timeline = document.getElementById('day-timeline');
      const dayEvents = getEventsForDay(day);

      if (!dayEvents.length) {
        timeline.innerHTML = `
          <div class="flex flex-col items-center justify-center py-28 text-zinc-300">
            <p class="text-[15px] font-medium">No events scheduled</p>
          </div>`;
        return;
      }

      timeline.innerHTML = dayEvents.map((e, i) => {
        const dimmed = isEventDimmed(e) ? 'is-dimmed' : '';
        const user = e.user;
        const u = user || { pastel: 'bg-zinc-100', ribbon: 'border-l-zinc-300', avatar: 'bg-zinc-100 text-zinc-500', initial: '?' };
        const timeStr = e.allDay ? 'All day' : formatTimeReadable(e.start);
        const label = stripUserPrefix(e.summary);

        return `
          <div class="group filter-fade rise-in ${dimmed} relative p-5 pr-[7rem] rounded-3xl border border-zinc-100 border-l-4 ${u.ribbon} ${u.pastel} bg-opacity-40 shadow-[0_8px_32px_rgba(0,0,0,0.02)]" style="animation-delay:${Math.min(i * 45, 270)}ms">
            <p class="text-[16px] font-bold text-zinc-900 tracking-tight leading-snug">${escapeHtml(label)}</p>
            <p class="text-[12px] text-zinc-500 font-medium mt-1.5">${timeStr}${user ? ` · ${user.name}` : ''}</p>
            ${eventBadgeRowHTML(e, u, 'lg')}
          </div>`;
      }).join('');
    }

    function renderMonthView() {
      updateMainHeader('Overview', 'Month', false);

      const ribbon = document.getElementById('month-ribbon');
      ribbon.innerHTML = MONTH_SHORT.map((label, i) => {
        const active = state.selectedMonth === i;
        return `
          <button type="button" data-month="${i}"
            class="touch-target shrink-0 px-4 py-2 rounded-2xl text-[13px] font-semibold tracking-tight transition-all
              ${active ? 'bg-zinc-900 text-white shadow-sm' : 'text-zinc-400 hover:text-zinc-700'}">
            ${label}
          </button>`;
      }).join('');

      ribbon.querySelectorAll('[data-month]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedMonth = parseInt(btn.dataset.month, 10);
          renderMonthView();
        });
      });

      renderMonthGrid();
    }

    function navigateToWeekFromMonth(weekNum) {
      const firstMonday = getMondayOfWeek(new Date(state.selectedYear, state.selectedMonth, 1));
      state.weekStartDate = addDays(firstMonday, (weekNum - 1) * 7);
      state.anchoredFromMonth = true;
      showView('week');
    }

    function renderMonthGrid() {
      const grid = document.getElementById('month-grid');
      const month = state.selectedMonth;
      const year = state.selectedYear;
      const startMonday = getMondayOfWeek(new Date(year, month, 1));
      const dayHeaders = ['M', 'T', 'W', 'Th', 'F', 'S', 'S'];

      const cells = ['<div aria-hidden="true"></div>'];
      dayHeaders.forEach(h => {
        cells.push(`<div class="text-center text-[11px] font-semibold text-zinc-400 tracking-[0.12em] py-2">${h}</div>`);
      });

      let cursor = new Date(startMonday);

      for (let row = 0; row < 5; row++) {
        cells.push(`
          <button type="button" data-week="${row + 1}"
            class="self-center w-full px-2 py-2.5 rounded-2xl bg-white border border-zinc-100 text-[11px] font-semibold text-zinc-500 shadow-[0_8px_32px_rgba(0,0,0,0.02)] hover:bg-zinc-50 active:scale-[0.98] transition-all whitespace-nowrap">
            Week ${row + 1}
          </button>`);

        for (let col = 0; col < 7; col++) {
          const inMonth = cursor.getMonth() === month;
          const dayEvents = inMonth ? getEventsForDay(cursor) : [];
          const dashes = dayEvents.slice(0, 6).map(e => {
            const c = e.user ? e.user.dash : 'bg-zinc-300';
            return `<span class="inline-block w-2 h-[3px] rounded-full ${c}"></span>`;
          }).join('');

          cells.push(`
            <button type="button" data-day-link="${dateKey(cursor)}" ${!inMonth ? 'disabled' : ''}
              class="touch-target min-h-[4rem] sm:min-h-[5rem] p-3 rounded-2xl text-left transition-all
                ${inMonth
                  ? 'bg-white border border-zinc-100 shadow-[0_8px_32px_rgba(0,0,0,0.02)] hover:shadow-[0_8px_32px_rgba(0,0,0,0.04)] active:scale-[0.98]'
                  : 'opacity-20 cursor-default'}
                ${isSameDay(cursor, new Date()) && inMonth ? 'ring-2 ring-zinc-900 ring-offset-2' : ''}">
              <span class="text-[15px] font-bold tracking-tight ${inMonth ? 'text-zinc-900' : 'text-zinc-400'}">${cursor.getDate()}</span>
              ${inMonth && dashes ? `<div class="flex gap-1 mt-2.5">${dashes}</div>` : ''}
            </button>`);
          cursor = addDays(cursor, 1);
        }
      }

      grid.innerHTML = cells.join('');

      grid.querySelectorAll('[data-week]').forEach(btn => {
        btn.addEventListener('click', () => navigateToWeekFromMonth(parseInt(btn.dataset.week, 10)));
      });
      bindDayLinks(grid);
    }

    function loadDemoEvents() {
      const today = startOfDay(new Date());
      const demos = [
        { user: 'anna', dayOffset: 0, hour: 10, min: 0, title: 'Anna Speech Therapy' },
        { user: 'anna', dayOffset: 1, hour: 14, min: 0, title: 'Anna Try on dress' },
        { user: 'simeon', dayOffset: 0, hour: 9, min: 30, title: 'Simeon Soccer practice' },
        { user: 'simeon', dayOffset: 2, hour: 16, min: 0, title: 'Simeon Piano lesson' },
        { user: 'tennille', dayOffset: 0, hour: 12, min: 0, title: 'Tennille Lunch with team' },
        { user: 'tennille', dayOffset: 3, hour: 11, min: 0, title: 'Tennille Dentist' },
        { user: 'bibi', dayOffset: 1, hour: 13, min: 0, title: 'Bibi OT session' },
        { user: 'bibi', dayOffset: 0, hour: 15, min: 30, title: 'Bibi Art class' },
        { user: 'anna', dayOffset: 4, hour: 8, min: 0, title: 'Anna School drop-off' },
        { user: 'simeon', dayOffset: 5, hour: 10, min: 0, title: 'Simeon Doctor visit' },
      ];

      events = demos.map((d, i) => {
        const start = addDays(today, d.dayOffset);
        start.setHours(d.hour, d.min, 0, 0);
        return {
          id: `demo-${d.user}-${i}`,
          summary: d.title,
          start,
          end: new Date(start.getTime() + 3600000),
          user: USERS.find(u => u.id === d.user),
          allDay: false,
        };
      });
      updateLastSynced(new Date(), 'Demo data');
      renderCurrentView();
    }

    function initEventListeners() {
      document.querySelectorAll('[data-nav]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = btn.dataset.nav;
          if (target === 'day') state.selectedDate = startOfDay(new Date());
          if (target === 'month') {
            state.selectedMonth = state.selectedDate.getMonth();
            state.selectedYear = state.selectedDate.getFullYear();
          }
          if (target === 'week' && !state.anchoredFromMonth) {
            state.weekStartDate = startOfDay(new Date());
          }
          showView(target);
        });
      });

      document.getElementById('btn-sync').addEventListener('click', fetchCalendarData);
      document.getElementById('btn-sync-mobile').addEventListener('click', fetchCalendarData);
      document.getElementById('btn-month-header').addEventListener('click', () => {
        if (state.view !== 'week') return;
        state.selectedMonth = state.selectedDate.getMonth();
        state.selectedYear = state.selectedDate.getFullYear();
        showView('month');
      });
      document.getElementById('btn-back-week').addEventListener('click', () => showView('week'));
      document.getElementById('btn-clear-filters').addEventListener('click', clearFilters);
    }

    function acceptEvent(e, eventId) {
      e.stopPropagation();
      console.log(`Event ${eventId} accepted.`);
      eventRsvp[eventId] = { ...eventRsvp[eventId], accepted: true };
      renderCurrentView();
    }

    function queryEvent(e, eventId) {
      e.stopPropagation();
      const note = prompt('Enter your question or note for the organizer:');
      if (note) {
        console.log(`Note for Event ${eventId}: ${note}`);
        eventRsvp[eventId] = { ...eventRsvp[eventId], queryPending: true, queryNote: note };
        renderCurrentView();
      }
    }

    function init() {
      initEventListeners();
      startClock();
      showView('week');
      if (!ICLOUD_URL || ICLOUD_URL === 'YOUR_HTTPS_ICLOUD_LINK_HERE') loadDemoEvents();
      startSyncLoop();
      scheduleMidnightRollover();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
