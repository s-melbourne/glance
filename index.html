<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="format-detection" content="telephone=no">
  <title>Glance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/ical.js@1.5.0/build/ical.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
        },
      },
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .safe-x {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .touch-target {
      min-height: 2.75rem;
      min-width: 2.75rem;
    }
    .lane-dimmed {
      opacity: 0.22;
      filter: grayscale(0.35);
      pointer-events: none;
    }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .sync-pulse { animation: pulse-dot 2s ease-in-out infinite; }
  </style>
</head>
<body class="bg-[#FAFAFA] text-zinc-600 font-sans antialiased min-h-screen safe-top safe-bottom safe-x">

  <!-- ═══════════════════════════════════════════════════════════════
       VIEW 1 — WEEKLY MATRIX (Main Dashboard)
       ═══════════════════════════════════════════════════════════════ -->
  <div id="view-week" class="view-container min-h-screen flex flex-col max-w-[1600px] mx-auto w-full">
    <header class="sticky top-0 z-30 bg-[#FAFAFA]/95 backdrop-blur-sm border-b border-zinc-200 px-4 sm:px-6 py-4">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <button id="btn-month-header" type="button"
          class="touch-target flex items-center gap-3 px-5 py-3 rounded-2xl bg-white border border-zinc-200 shadow-sm hover:shadow-md active:scale-[0.98] transition-all">
          <span id="week-month-label" class="text-2xl sm:text-3xl font-bold text-zinc-900 tracking-tight">June</span>
          <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        </button>
        <div class="flex items-center gap-3">
          <p id="last-updated" class="text-xs text-zinc-400 hidden sm:block">Last updated —</p>
          <button id="btn-clear-filters" type="button"
            class="touch-target px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-600 bg-white border border-zinc-200 shadow-sm hover:bg-zinc-50 active:scale-[0.98] transition-all">
            Clear Filters
          </button>
        </div>
      </div>
      <p id="last-updated-mobile" class="text-xs text-zinc-400 mt-2 sm:hidden">Last updated —</p>
    </header>

    <main class="flex-1 px-2 sm:px-4 py-4 overflow-x-auto">
      <!-- Day column headers -->
      <div id="week-day-headers" class="grid grid-cols-8 gap-1 sm:gap-2 mb-2 min-w-[640px]"></div>
      <!-- User rows -->
      <div id="week-matrix" class="space-y-2 min-w-[640px]"></div>
    </main>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       VIEW 2 — FOCUSED DAILY TIMELINE
       ═══════════════════════════════════════════════════════════════ -->
  <div id="view-day" class="view-container hidden min-h-screen flex max-w-[1200px] mx-auto w-full">
    <!-- User filter strip (left margin) -->
    <aside id="day-user-strip" class="hidden sm:flex flex-col gap-2 p-3 border-r border-zinc-200 bg-white/80 shrink-0"></aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 bg-[#FAFAFA]/95 backdrop-blur-sm border-b border-zinc-200 px-4 sm:px-6 py-4">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p id="day-date-sub" class="text-sm text-zinc-500 font-medium"></p>
            <h1 id="day-name-label" class="text-3xl sm:text-4xl font-bold text-zinc-900 tracking-tight">Monday</h1>
          </div>
          <button id="btn-back-week" type="button"
            class="touch-target px-6 py-3 rounded-2xl bg-white border border-zinc-200 shadow-sm text-base font-semibold text-zinc-700 hover:shadow-md active:scale-[0.98] transition-all">
            week
          </button>
        </div>
        <!-- Mobile user filters -->
        <div id="day-user-strip-mobile" class="flex sm:hidden gap-2 mt-4 overflow-x-auto pb-1"></div>
      </header>

      <main id="day-timeline" class="flex-1 px-4 sm:px-8 py-6 overflow-y-auto scrollbar-thin space-y-3"></main>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════════
       VIEW 3 — MACRO MONTHLY GRID
       ═══════════════════════════════════════════════════════════════ -->
  <div id="view-month" class="view-container hidden min-h-screen flex max-w-[1400px] mx-auto w-full">
    <!-- Week number buttons (left margin) -->
    <aside id="month-week-strip" class="hidden md:flex flex-col gap-2 p-3 border-r border-zinc-200 bg-white/80 shrink-0"></aside>

    <div class="flex-1 flex flex-col min-w-0">
      <header class="sticky top-0 z-30 bg-[#FAFAFA]/95 backdrop-blur-sm border-b border-zinc-200 px-4 sm:px-6 py-4">
        <div class="flex items-center justify-between gap-3 mb-4">
          <h1 class="text-2xl sm:text-3xl font-bold text-zinc-900">Calendar</h1>
          <button id="btn-month-clear-filters" type="button"
            class="touch-target px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-600 bg-white border border-zinc-200 shadow-sm hover:bg-zinc-50 active:scale-[0.98] transition-all">
            Clear Filters
          </button>
        </div>
        <!-- Month ribbon -->
        <div id="month-ribbon" class="flex gap-1 sm:gap-2 overflow-x-auto pb-1"></div>
        <!-- Mobile week buttons -->
        <div id="month-week-strip-mobile" class="flex md:hidden gap-2 mt-3 overflow-x-auto pb-1"></div>
      </header>

      <div class="flex flex-1 min-h-0">
        <!-- User filter strip -->
        <aside id="month-user-strip" class="hidden sm:flex flex-col gap-2 p-3 border-r border-zinc-200 bg-white/80 shrink-0"></aside>

        <main class="flex-1 p-3 sm:p-6 overflow-auto">
          <!-- Day-of-week headers -->
          <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2">
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">M</div>
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">T</div>
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">W</div>
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">Th</div>
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">F</div>
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">S</div>
            <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">S</div>
          </div>
          <div id="month-grid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>
        </main>
      </div>

      <!-- Mobile user filters -->
      <div id="month-user-strip-mobile" class="flex sm:hidden gap-2 px-4 py-3 border-t border-zinc-200 overflow-x-auto"></div>
    </div>
  </div>

  <script>
    /* ─── iCloud feed URL (replace with your published calendar link) ─── */
    const ICLOUD_URL = "YOUR_HTTPS_ICLOUD_LINK_HERE";

    /* ─── Family member configuration ─── */
    const USERS = [
      { id: 'anna',    name: 'Anna',    keywords: ['anna'],    bg: 'bg-pink-50',    border: 'border-pink-200',    text: 'text-pink-700',    dot: 'bg-pink-400' },
      { id: 'simeon',  name: 'Simeon',  keywords: ['simeon'],  bg: 'bg-blue-50',    border: 'border-blue-200',    text: 'text-blue-700',    dot: 'bg-blue-400' },
      { id: 'tennille',name: 'Tennille',keywords: ['tennille'],bg: 'bg-emerald-50', border: 'border-emerald-200', text: 'text-emerald-700', dot: 'bg-emerald-400' },
      { id: 'bibi',    name: 'Bibi',    keywords: ['bibi'],    bg: 'bg-purple-50',  border: 'border-purple-200',  text: 'text-purple-700',  dot: 'bg-purple-400' },
    ];

    const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const MONTH_SHORT = ['J','F','M','A','M','June','J','A','S','O','N','D'];
    const DAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const DAY_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const SYNC_INTERVAL_MS = 15 * 60 * 1000;

    /* ─── Application state ─── */
    let events = [];
    let state = {
      view: 'week',
      selectedDate: startOfDay(new Date()),
      selectedMonth: new Date().getMonth(),
      selectedYear: new Date().getFullYear(),
      filteredUser: null,
      weekStartDate: startOfDay(new Date()),
      anchoredFromMonth: false,
    };

    let syncTimer = null;
    let midnightTimer = null;

    /* ─── Date utilities ─── */
    function startOfDay(d) {
      const x = new Date(d);
      x.setHours(0, 0, 0, 0);
      return x;
    }

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() &&
             a.getMonth() === b.getMonth() &&
             a.getDate() === b.getDate();
    }

    function dateKey(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function addDays(d, n) {
      const x = new Date(d);
      x.setDate(x.getDate() + n);
      return startOfDay(x);
    }

    function formatTimeReadable(d) {
      const h = d.getHours() % 12 || 12;
      const m = d.getMinutes();
      return m === 0 ? `${h}:00` : `${h}:${String(m).padStart(2, '0')}`;
    }

    function getRollingDays(startDate) {
      return Array.from({ length: 7 }, (_, i) => addDays(startDate, i));
    }

    function getMondayOfWeek(d) {
      const x = startOfDay(d);
      const day = x.getDay();
      const diff = day === 0 ? -6 : 1 - day;
      return addDays(x, diff);
    }

    /* ─── Event parsing & user matching ─── */
    function matchUser(text) {
      const lower = (text || '').toLowerCase();
      for (const user of USERS) {
        if (user.keywords.some(kw => lower.includes(kw))) return user;
      }
      return null;
    }

    function parseICalEvents(icalData) {
      const jcal = ICAL.parse(icalData);
      const comp = new ICAL.Component(jcal);
      const vevents = comp.getAllSubcomponents('vevent');
      const parsed = [];

      for (const vevent of vevents) {
        const event = new ICAL.Event(vevent);
        const summary = event.summary || 'Untitled';
        const start = event.startDate.toJSDate();
        const end = event.endDate ? event.endDate.toJSDate() : new Date(start.getTime() + 3600000);
        const user = matchUser(summary);

        if (event.startDate.isDate) {
          let cursor = startOfDay(start);
          const last = startOfDay(end);
          while (cursor < last) {
            parsed.push({ summary, start: new Date(cursor), end: addDays(cursor, 1), user, allDay: true });
            cursor = addDays(cursor, 1);
          }
        } else {
          parsed.push({ summary, start, end, user, allDay: false });
        }
      }
      return parsed;
    }

    function getEventsForDay(day, userId = null) {
      const key = dateKey(day);
      return events
        .filter(e => {
          const eDay = startOfDay(e.start);
          if (dateKey(eDay) !== key) return false;
          if (userId && (!e.user || e.user.id !== userId)) return false;
          if (state.filteredUser && (!e.user || e.user.id !== state.filteredUser)) return false;
          return true;
        })
        .sort((a, b) => a.start - b.start);
    }

    function getEventsForUserOnDay(userId, day) {
      const key = dateKey(day);
      return events
        .filter(e => e.user && e.user.id === userId && dateKey(startOfDay(e.start)) === key)
        .sort((a, b) => a.start - b.start);
    }

    /* ─── Calendar fetch ─── */
    async function fetchCalendarData() {
      if (!ICLOUD_URL || ICLOUD_URL === 'YOUR_HTTPS_ICLOUD_LINK_HERE') {
        updateLastSynced(null, 'Set ICLOUD_URL to sync');
        return;
      }

      try {
        const proxiedUrl = 'https://corsproxy.io/?url=' + encodeURIComponent(ICLOUD_URL);
        const response = await fetch(proxiedUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        events = parseICalEvents(text);
        updateLastSynced(new Date());
        renderCurrentView();
      } catch (err) {
        console.error('Calendar sync failed:', err);
        updateLastSynced(null, 'Sync failed');
      }
    }

    function updateLastSynced(date, overrideText) {
      const text = overrideText || (date
        ? `Last updated ${date.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`
        : 'Last updated —');
      document.getElementById('last-updated').textContent = text;
      document.getElementById('last-updated-mobile').textContent = text;
    }

    function startSyncLoop() {
      fetchCalendarData();
      if (syncTimer) clearInterval(syncTimer);
      syncTimer = setInterval(fetchCalendarData, SYNC_INTERVAL_MS);
    }

    function scheduleMidnightRollover() {
      if (midnightTimer) clearTimeout(midnightTimer);
      const now = new Date();
      const tomorrow = new Date(now);
      tomorrow.setDate(tomorrow.getDate() + 1);
      tomorrow.setHours(0, 0, 1, 0);
      const ms = tomorrow - now;
      midnightTimer = setTimeout(() => {
        if (!state.anchoredFromMonth) {
          state.weekStartDate = startOfDay(new Date());
        }
        state.selectedDate = startOfDay(new Date());
        renderCurrentView();
        scheduleMidnightRollover();
      }, ms);
    }

    /* ─── View navigation ─── */
    function showView(name) {
      state.view = name;
      document.querySelectorAll('.view-container').forEach(el => el.classList.add('hidden'));
      const target = document.getElementById(`view-${name}`);
      if (target) target.classList.remove('hidden');
      renderCurrentView();
    }

    function renderCurrentView() {
      if (state.view === 'week') renderWeekView();
      else if (state.view === 'day') renderDayView();
      else if (state.view === 'month') renderMonthView();
    }

    function clearFilters() {
      state.filteredUser = null;
      state.anchoredFromMonth = false;
      state.weekStartDate = startOfDay(new Date());
      renderCurrentView();
    }

    /* ─── User badge HTML ─── */
    function userBadgeHTML(user, options = {}) {
      const { active = false, compact = false, onClick = true } = options;
      const activeRing = active ? 'ring-2 ring-offset-2 ring-zinc-400' : '';
      const size = compact ? 'px-3 py-2 text-sm' : 'px-4 py-3 text-base sm:text-lg';
      const click = onClick ? `data-user-filter="${user.id}"` : '';
      return `
        <button type="button" ${click}
          class="touch-target user-badge ${size} rounded-2xl font-semibold ${user.bg} ${user.border} ${user.text} border shadow-sm hover:shadow-md active:scale-[0.97] transition-all ${activeRing} whitespace-nowrap">
          ${user.name}
        </button>`;
    }

    function bindUserFilterButtons(container) {
      container.querySelectorAll('[data-user-filter]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.userFilter;
          state.filteredUser = state.filteredUser === id ? null : id;
          renderCurrentView();
        });
      });
    }

    /* ─── VIEW 1: Weekly Matrix ─── */
    function renderWeekView() {
      const days = getRollingDays(state.weekStartDate);
      const monthLabel = document.getElementById('week-month-label');
      const today = new Date();
      monthLabel.textContent = MONTH_NAMES[days[0].getMonth()];

      const headersEl = document.getElementById('week-day-headers');
      headersEl.innerHTML = `
        <div class="flex items-center justify-center text-xs sm:text-sm font-semibold text-zinc-400 py-2"></div>
        ${days.map(day => {
          const isToday = isSameDay(day, today);
          return `
            <button type="button" data-day-link="${dateKey(day)}"
              class="touch-target day-cell-header flex flex-col items-center justify-center py-2 sm:py-3 rounded-xl ${isToday ? 'bg-zinc-900 text-white' : 'bg-white border border-zinc-200 text-zinc-700'} shadow-sm hover:shadow-md active:scale-[0.97] transition-all">
              <span class="text-[10px] sm:text-xs font-medium opacity-80">${DAY_SHORT[day.getDay()]}</span>
              <span class="text-lg sm:text-xl font-bold">${day.getDate()}</span>
            </button>`;
        }).join('')}
      `;

      const matrixEl = document.getElementById('week-matrix');
      matrixEl.innerHTML = USERS.map(user => {
        const dimmed = state.filteredUser && state.filteredUser !== user.id ? 'lane-dimmed' : '';
        const active = state.filteredUser === user.id;
        return `
          <div class="week-row grid grid-cols-8 gap-1 sm:gap-2 ${dimmed}" data-user-row="${user.id}">
            <div class="flex items-center justify-center p-1">
              ${userBadgeHTML(user, { active, compact: true })}
            </div>
            ${days.map(day => {
              const dayEvents = getEventsForUserOnDay(user.id, day);
              const preview = dayEvents.slice(0, 3).map(e => `
                <div class="truncate text-[10px] sm:text-xs font-medium ${user.text} leading-tight">${e.allDay ? 'All day' : formatTimeReadable(e.start)} ${stripUserPrefix(e.summary)}</div>
              `).join('');
              const more = dayEvents.length > 3 ? `<div class="text-[10px] text-zinc-400 font-medium">+${dayEvents.length - 3} more</div>` : '';
              return `
                <button type="button" data-day-link="${dateKey(day)}"
                  class="touch-target day-cell min-h-[4.5rem] sm:min-h-[5.5rem] p-2 sm:p-3 rounded-xl bg-white border border-zinc-200 shadow-sm hover:shadow-md active:scale-[0.98] transition-all text-left overflow-hidden">
                  <div class="space-y-0.5">${preview}${more}</div>
                  ${dayEvents.length === 0 ? '<div class="h-full flex items-center justify-center text-zinc-300 text-xs">—</div>' : ''}
                </button>`;
            }).join('')}
          </div>`;
      }).join('');

      bindUserFilterButtons(matrixEl);
      bindDayLinks(headersEl);
      bindDayLinks(matrixEl);

      matrixEl.querySelectorAll('.week-row .user-badge').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.userFilter;
          state.filteredUser = state.filteredUser === id ? null : id;
          renderWeekView();
        });
      });
    }

    function stripUserPrefix(summary) {
      let s = summary;
      for (const u of USERS) {
        for (const kw of u.keywords) {
          s = s.replace(new RegExp(kw, 'gi'), '').trim();
        }
      }
      return s.replace(/^[-:,\s]+/, '').trim() || summary;
    }

    function bindDayLinks(container) {
      container.querySelectorAll('[data-day-link]').forEach(btn => {
        btn.addEventListener('click', () => {
          const [y, m, d] = btn.dataset.dayLink.split('-').map(Number);
          state.selectedDate = new Date(y, m - 1, d);
          showView('day');
        });
      });
    }

    /* ─── VIEW 2: Daily Timeline ─── */
    function renderDayView() {
      const day = state.selectedDate;
      document.getElementById('day-name-label').textContent = DAY_NAMES[day.getDay()];
      document.getElementById('day-date-sub').textContent =
        `${MONTH_NAMES[day.getMonth()]} ${day.getDate()}, ${day.getFullYear()}`;

      const strips = ['day-user-strip', 'day-user-strip-mobile'];
      strips.forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = USERS.map(u => userBadgeHTML(u, { active: state.filteredUser === u.id, compact: id.includes('mobile') })).join('');
        bindUserFilterButtons(el);
      });

      const timeline = document.getElementById('day-timeline');
      const dayEvents = getEventsForDay(day);

      if (dayEvents.length === 0) {
        timeline.innerHTML = `
          <div class="flex flex-col items-center justify-center py-20 text-zinc-400">
            <svg class="w-16 h-16 mb-4 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <p class="text-lg font-medium">No events scheduled</p>
          </div>`;
        return;
      }

      timeline.innerHTML = dayEvents.map(e => {
        const user = e.user;
        const uStyle = user
          ? `${user.bg} ${user.border} ${user.text}`
          : 'bg-white border-zinc-200 text-zinc-700';
        const timeStr = e.allDay ? 'All day' : formatTimeReadable(e.start);
        const label = stripUserPrefix(e.summary);
        return `
          <div class="rounded-2xl border shadow-sm p-5 sm:p-6 ${uStyle} transition-all">
            <p class="text-2xl sm:text-3xl md:text-4xl font-bold tracking-tight leading-tight">
              <span class="text-zinc-500 font-semibold text-xl sm:text-2xl md:text-3xl mr-2">${timeStr}</span>
              ${escapeHtml(label)}
            </p>
            ${user ? `<p class="mt-2 text-sm font-semibold opacity-70">${user.name}</p>` : ''}
          </div>`;
      }).join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* ─── VIEW 3: Monthly Grid ─── */
    function renderMonthView() {
      renderMonthRibbon();
      renderWeekStrips();
      renderUserStrips();
      renderMonthGrid();
    }

    function renderMonthRibbon() {
      const ribbon = document.getElementById('month-ribbon');
      ribbon.innerHTML = MONTH_SHORT.map((label, i) => {
        const isActive = state.selectedMonth === i;
        const display = label.length > 1 ? label : label;
        return `
          <button type="button" data-month="${i}"
            class="touch-target flex-shrink-0 px-3 sm:px-4 py-2.5 rounded-xl text-sm sm:text-base font-semibold transition-all active:scale-[0.97]
              ${isActive ? 'bg-zinc-900 text-white shadow-md' : 'bg-white border border-zinc-200 text-zinc-600 hover:bg-zinc-50 shadow-sm'}">
            ${display}
          </button>`;
      }).join('');

      ribbon.querySelectorAll('[data-month]').forEach(btn => {
        btn.addEventListener('click', () => {
          state.selectedMonth = parseInt(btn.dataset.month, 10);
          renderMonthView();
        });
      });
    }

    function renderWeekStrips() {
      const weekBtn = (n) => `
        <button type="button" data-week="${n}"
          class="touch-target px-4 py-3 rounded-xl bg-white border border-zinc-200 shadow-sm text-sm font-bold text-zinc-700 hover:shadow-md active:scale-[0.97] transition-all whitespace-nowrap">
          Week ${n}
        </button>`;

      ['month-week-strip', 'month-week-strip-mobile'].forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = [1, 2, 3, 4, 5].map(weekBtn).join('');
        el.querySelectorAll('[data-week]').forEach(btn => {
          btn.addEventListener('click', () => {
            const weekNum = parseInt(btn.dataset.week, 10);
            navigateToWeekFromMonth(weekNum);
          });
        });
      });
    }

    function navigateToWeekFromMonth(weekNum) {
      const year = state.selectedYear;
      const month = state.selectedMonth;
      const firstOfMonth = new Date(year, month, 1);
      const firstMonday = getMondayOfWeek(firstOfMonth);
      if (firstMonday.getMonth() > month || (firstMonday.getDate() > 1 && firstMonday.getMonth() === month)) {
        // firstMonday might be in previous month — that's correct for grid row 1
      }
      const weekStart = addDays(firstMonday, (weekNum - 1) * 7);
      state.weekStartDate = weekStart;
      state.anchoredFromMonth = true;
      showView('week');
    }

    function renderUserStrips() {
      ['month-user-strip', 'month-user-strip-mobile'].forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = USERS.map(u => userBadgeHTML(u, { active: state.filteredUser === u.id, compact: id.includes('mobile') })).join('');
        bindUserFilterButtons(el);
      });
    }

    function renderMonthGrid() {
      const grid = document.getElementById('month-grid');
      const year = state.selectedYear;
      const month = state.selectedMonth;
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);
      const startMonday = getMondayOfWeek(firstDay);

      const cells = [];
      let cursor = new Date(startMonday);

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 7; col++) {
          const inMonth = cursor.getMonth() === month;
          const dayEvents = inMonth ? getEventsForDay(cursor) : [];
          const indicators = dayEvents.slice(0, 4).map(e => {
            const dot = e.user ? e.user.dot : 'bg-zinc-300';
            return `<div class="h-1 rounded-full ${dot} flex-1 min-w-[8px] max-w-[24px]"></div>`;
          }).join('');

          cells.push(`
            <button type="button" data-day-link="${dateKey(cursor)}" ${!inMonth ? 'disabled' : ''}
              class="touch-target min-h-[3.5rem] sm:min-h-[5rem] p-2 rounded-xl transition-all text-left
                ${inMonth
                  ? 'bg-white border border-zinc-200 shadow-sm hover:shadow-md active:scale-[0.97] cursor-pointer'
                  : 'bg-transparent border border-transparent opacity-30 cursor-default'}
                ${isSameDay(cursor, new Date()) && inMonth ? 'ring-2 ring-zinc-900 ring-offset-1' : ''}">
              <span class="text-sm sm:text-base font-bold ${inMonth ? 'text-zinc-800' : 'text-zinc-400'}">${cursor.getDate()}</span>
              ${inMonth && indicators ? `<div class="flex gap-0.5 mt-1.5 flex-wrap">${indicators}</div>` : ''}
            </button>`);
          cursor = addDays(cursor, 1);
        }
      }

      grid.innerHTML = cells.join('');
      bindDayLinks(grid);
    }

    /* ─── Demo data for preview without iCloud URL ─── */
    function loadDemoEvents() {
      const today = startOfDay(new Date());
      const demos = [
        { user: 'anna', dayOffset: 0, hour: 10, min: 0, title: 'Anna Speech Therapy' },
        { user: 'anna', dayOffset: 1, hour: 14, min: 0, title: 'Anna Try on dress' },
        { user: 'simeon', dayOffset: 0, hour: 9, min: 30, title: 'Simeon Soccer practice' },
        { user: 'simeon', dayOffset: 2, hour: 16, min: 0, title: 'Simeon Piano lesson' },
        { user: 'tennille', dayOffset: 0, hour: 12, min: 0, title: 'Tennille Lunch with team' },
        { user: 'tennille', dayOffset: 3, hour: 11, min: 0, title: 'Tennille Dentist' },
        { user: 'bibi', dayOffset: 1, hour: 13, min: 0, title: 'Bibi OT session' },
        { user: 'bibi', dayOffset: 0, hour: 15, min: 30, title: 'Bibi Art class' },
        { user: 'anna', dayOffset: 4, hour: 8, min: 0, title: 'Anna School drop-off' },
        { user: 'simeon', dayOffset: 5, hour: 10, min: 0, title: 'Simeon Doctor visit' },
      ];

      events = demos.map(d => {
        const start = addDays(today, d.dayOffset);
        start.setHours(d.hour, d.min, 0, 0);
        const end = new Date(start.getTime() + 3600000);
        const user = USERS.find(u => u.id === d.user);
        return { summary: d.title, start, end, user, allDay: false };
      });
      updateLastSynced(new Date(), 'Demo data loaded');
      renderCurrentView();
    }

    /* ─── Event bindings ─── */
    function initEventListeners() {
      document.getElementById('btn-month-header').addEventListener('click', () => {
        state.selectedMonth = state.selectedDate.getMonth();
        state.selectedYear = state.selectedDate.getFullYear();
        showView('month');
      });

      document.getElementById('btn-back-week').addEventListener('click', () => {
        state.filteredUser = null;
        showView('week');
      });

      document.getElementById('btn-clear-filters').addEventListener('click', clearFilters);
      document.getElementById('btn-month-clear-filters').addEventListener('click', clearFilters);
    }

    /* ─── Bootstrap ─── */
    function init() {
      initEventListeners();
      showView('week');

      if (!ICLOUD_URL || ICLOUD_URL === 'YOUR_HTTPS_ICLOUD_LINK_HERE') {
        loadDemoEvents();
      }

      startSyncLoop();
      scheduleMidnightRollover();
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
