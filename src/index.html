<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Glance">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="format-detection" content="telephone=no">
  <title>Glance</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Manrope', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            display: ['Playfair Display', 'Georgia', 'serif'],
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --glance-bg-1: #f4f5f7;
      --glance-bg-2: #edf2f8;
      --glance-surface: rgba(255, 255, 255, 0.9);
      --glance-border: rgba(24, 24, 27, 0.1);
      --glance-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      --sidebar-w-collapsed: 4.25rem;
      --sidebar-w-expanded: 17rem;
      --sidebar-bg: #f7f6f3;
      --sidebar-border: rgba(24, 24, 27, 0.08);
    }
    html, body {
      height: 100%;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    body {
      background:
        radial-gradient(1200px 600px at 0% 0%, #e0ecff 0%, transparent 60%),
        radial-gradient(900px 500px at 100% 100%, #ffe6d8 0%, transparent 55%),
        linear-gradient(180deg, var(--glance-bg-1) 0%, var(--glance-bg-2) 100%);
      background-attachment: fixed;
    }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .safe-x {
      padding-left: env(safe-area-inset-left, 0px);
      padding-right: env(safe-area-inset-right, 0px);
    }
    .touch-target {
      min-height: 2.75rem;
      min-width: 2.75rem;
    }
    .lane-dimmed {
      opacity: 0.22;
      filter: grayscale(0.35);
      pointer-events: none;
    }
    .scrollbar-thin::-webkit-scrollbar { width: 4px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
    .glass-panel {
      background: var(--glance-surface);
      border: 1px solid var(--glance-border);
      box-shadow: var(--glance-shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .elevate-hover {
      transition: transform 220ms ease, box-shadow 220ms ease;
    }
    .elevate-hover:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(24, 24, 27, 0.1);
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .stagger-item { animation: rise-in 380ms ease both; }

    /* ─── Fixed sidebar rail (Copilot-style) ─── */
    #sidebar-backdrop {
      opacity: 0;
      pointer-events: none;
      transition: opacity 240ms ease;
    }
    #sidebar-backdrop.is-visible {
      opacity: 1;
      pointer-events: auto;
    }
    #sidebar {
      width: var(--sidebar-w-collapsed);
      background: var(--sidebar-bg);
      border-right: 1px solid var(--sidebar-border);
      transition: width 280ms cubic-bezier(0.4, 0, 0.2, 1), transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (min-width: 768px) {
      #sidebar.is-pinned,
      #sidebar:hover {
        width: var(--sidebar-w-expanded);
      }
    }
    @media (max-width: 767px) {
      #sidebar {
        width: var(--sidebar-w-expanded);
        transform: translateX(-100%);
      }
      #sidebar.is-mobile-open {
        transform: translateX(0);
      }
    }
    .sidebar-label,
    .sidebar-section-title,
    .sidebar-meta,
    .sidebar-profile-text,
    .sidebar-pin-btn {
      opacity: 0;
      max-width: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: opacity 180ms ease, max-width 280ms ease;
    }
    #sidebar.is-pinned .sidebar-label,
    #sidebar.is-pinned .sidebar-section-title,
    #sidebar.is-pinned .sidebar-meta,
    #sidebar.is-pinned .sidebar-profile-text,
    #sidebar.is-pinned .sidebar-pin-btn,
    #sidebar:hover .sidebar-label,
    #sidebar:hover .sidebar-section-title,
    #sidebar:hover .sidebar-meta,
    #sidebar:hover .sidebar-profile-text,
    #sidebar:hover .sidebar-pin-btn,
    #sidebar.is-mobile-open .sidebar-label,
    #sidebar.is-mobile-open .sidebar-section-title,
    #sidebar.is-mobile-open .sidebar-meta,
    #sidebar.is-mobile-open .sidebar-profile-text,
    #sidebar.is-mobile-open .sidebar-pin-btn {
      opacity: 1;
      max-width: 12rem;
    }
    .sidebar-nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.625rem 0.75rem;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      font-weight: 500;
      color: #3f3f46;
      transition: background 160ms ease, color 160ms ease;
    }
    .sidebar-nav-item:hover {
      background: rgba(24, 24, 27, 0.06);
    }
    .sidebar-nav-item.is-active {
      background: rgba(24, 24, 27, 0.08);
      color: #18181b;
      font-weight: 600;
    }
    .sidebar-nav-icon {
      flex-shrink: 0;
      width: 1.25rem;
      height: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #52525b;
    }
    .sidebar-nav-item.is-active .sidebar-nav-icon {
      color: #18181b;
    }
    .sidebar-user-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      width: 100%;
      padding: 0.5rem 0.75rem;
      border-radius: 0.625rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: background 160ms ease;
    }
    .sidebar-user-item:hover {
      background: rgba(24, 24, 27, 0.06);
    }
    .sidebar-user-item.is-active {
      background: rgba(24, 24, 27, 0.08);
    }
    .sidebar-user-dot {
      flex-shrink: 0;
      width: 1.75rem;
      height: 1.75rem;
      border-radius: 9999px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.6875rem;
      font-weight: 700;
    }
    .sidebar-divider {
      height: 1px;
      background: var(--sidebar-border);
      margin: 0.5rem 0.75rem;
    }
    .sidebar-logo {
      width: 2rem;
      height: 2rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #6366f1 0%, #ec4899 50%, #f59e0b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sidebar-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.625rem 0.75rem;
      border-radius: 0.75rem;
      transition: background 160ms ease;
    }
    .sidebar-profile:hover {
      background: rgba(24, 24, 27, 0.06);
    }
    .sidebar-avatar {
      width: 2rem;
      height: 2rem;
      border-radius: 9999px;
      background: #059669;
      color: white;
      font-size: 0.8125rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    @media (min-width: 768px) {
      #sidebar:not(.is-pinned):not(:hover) > div:first-child {
        justify-content: center;
        padding-left: 0.75rem;
        padding-right: 0.75rem;
      }
      #sidebar:not(.is-pinned):not(:hover) .sidebar-nav-item,
      #sidebar:not(.is-pinned):not(:hover) .sidebar-user-item,
      #sidebar:not(.is-pinned):not(:hover) .sidebar-profile {
        justify-content: center;
      }
      #sidebar:not(.is-pinned):not(:hover) .sidebar-section-title,
      #sidebar:not(.is-pinned):not(:hover) .sidebar-divider {
        display: none;
      }
      #sidebar:not(.is-pinned):not(:hover) .sidebar-meta {
        display: none;
      }
    }
  </style>
</head>
<body class="text-zinc-700 font-sans antialiased min-h-screen overflow-x-hidden">

  <div id="app-shell" class="flex min-h-screen w-full safe-top safe-bottom safe-x">
    <div id="sidebar-backdrop" class="fixed inset-0 z-40 bg-zinc-900/40 backdrop-blur-sm md:hidden" aria-hidden="true"></div>

    <aside id="sidebar"
      class="fixed md:sticky top-0 left-0 z-50 md:z-40 h-screen shrink-0 flex flex-col overflow-hidden"
      aria-label="Main navigation">
      <div class="flex items-center justify-between gap-2 px-3 py-4 min-h-[4.25rem]">
        <div class="flex items-center gap-3 min-w-0 overflow-hidden">
          <div class="sidebar-logo" aria-hidden="true">
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          </div>
          <span class="sidebar-label text-lg font-bold text-zinc-900 tracking-tight">Glance</span>
        </div>
        <button id="btn-sidebar-pin" type="button"
          class="sidebar-pin-btn touch-target hidden md:flex p-1.5 rounded-lg text-zinc-500 hover:bg-zinc-200/60 hover:text-zinc-800 transition-colors"
          aria-label="Pin sidebar open" title="Pin sidebar">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button id="btn-sidebar-close" type="button" data-sidebar-toggle
          class="sidebar-pin-btn touch-target md:hidden p-1.5 rounded-lg text-zinc-500 hover:bg-zinc-200/60"
          aria-label="Close menu">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <nav class="flex-1 overflow-y-auto scrollbar-thin px-2 pb-2" aria-label="Primary">
        <div class="space-y-0.5">
          <button type="button" data-nav="week" class="sidebar-nav-item sidebar-nav-item-view">
            <span class="sidebar-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg></span>
            <span class="sidebar-label">Week</span>
          </button>
          <button type="button" data-nav="day" class="sidebar-nav-item sidebar-nav-item-view">
            <span class="sidebar-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></span>
            <span class="sidebar-label">Today</span>
          </button>
          <button type="button" data-nav="month" class="sidebar-nav-item sidebar-nav-item-view">
            <span class="sidebar-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg></span>
            <span class="sidebar-label">Month</span>
          </button>
        </div>

        <div class="sidebar-divider"></div>

        <p class="sidebar-section-title px-3 py-1.5 text-[11px] font-semibold uppercase tracking-wider text-zinc-400">Family</p>
        <div id="sidebar-user-filters" class="space-y-0.5"></div>

        <div class="sidebar-divider"></div>

        <div class="space-y-0.5">
          <button id="btn-sidebar-sync" type="button" class="sidebar-nav-item">
            <span class="sidebar-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg></span>
            <span class="sidebar-label">Refresh</span>
          </button>
          <button id="btn-sidebar-clear" type="button" class="sidebar-nav-item">
            <span class="sidebar-nav-icon"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M6 18L18 6M6 6l12 12"/></svg></span>
            <span class="sidebar-label">Clear filters</span>
          </button>
        </div>
      </nav>

      <div class="shrink-0 border-t border-zinc-200/80 px-2 py-3 space-y-2">
        <p id="sidebar-last-updated" class="sidebar-meta px-3 text-[11px] text-zinc-400 truncate">Last updated —</p>
        <button type="button" id="btn-sidebar-profile" class="sidebar-profile w-full text-left">
          <span class="sidebar-avatar">G</span>
          <span class="sidebar-profile-text min-w-0">
            <span class="block text-sm font-semibold text-zinc-900 truncate">Family</span>
            <span class="block text-xs text-zinc-500 truncate">Sign in coming soon</span>
          </span>
        </button>
      </div>
    </aside>

    <div id="main-content" class="flex-1 min-w-0 flex flex-col min-h-screen">
      <div id="view-week" class="view-container min-h-screen flex flex-col max-w-[1600px] mx-auto w-full">
        <header class="sticky top-0 z-30 glass-panel border-b border-zinc-200 px-4 sm:px-6 py-4">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div class="flex items-center gap-2 sm:gap-3 min-w-0">
              <button type="button" data-sidebar-toggle class="md:hidden touch-target shrink-0 p-2.5 rounded-xl bg-white border border-zinc-200 shadow-sm text-zinc-600 hover:bg-zinc-50 active:scale-95 transition-all elevate-hover" aria-label="Open menu">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
              </button>
              <button id="btn-month-header" type="button" class="touch-target flex items-center gap-3 px-5 py-3 rounded-2xl bg-white border border-zinc-200 shadow-sm hover:shadow-md active:scale-[0.98] transition-all elevate-hover">
                <span id="week-month-label" class="text-2xl sm:text-3xl font-display font-bold text-zinc-900 tracking-tight">June</span>
              </button>
            </div>
            <div class="flex items-center gap-3">
              <p id="last-updated" class="text-xs text-zinc-400 hidden sm:block">Last updated -</p>
              <button id="btn-clear-filters" type="button" class="touch-target px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-600 bg-white border border-zinc-200 shadow-sm hover:bg-zinc-50 active:scale-[0.98] transition-all elevate-hover">Clear Filters</button>
            </div>
          </div>
          <p id="last-updated-mobile" class="text-xs text-zinc-400 mt-2 sm:hidden">Last updated -</p>
        </header>

        <main class="flex-1 px-2 sm:px-4 py-4 overflow-x-auto">
          <div id="week-day-headers" class="grid grid-cols-8 gap-1 sm:gap-2 mb-2 min-w-[640px]"></div>
          <div id="week-matrix" class="space-y-2 min-w-[640px]"></div>
        </main>
      </div>

      <div id="view-day" class="view-container hidden min-h-screen flex max-w-[1200px] mx-auto w-full">
        <aside id="day-user-strip" class="hidden sm:flex flex-col gap-2 p-3 border-r border-zinc-200 bg-white/80 shrink-0"></aside>
        <div class="flex-1 flex flex-col min-w-0">
          <header class="sticky top-0 z-30 glass-panel border-b border-zinc-200 px-4 sm:px-6 py-4">
            <div class="flex items-center justify-between gap-4">
              <div class="flex items-center gap-3 min-w-0">
                <button type="button" data-sidebar-toggle class="md:hidden touch-target shrink-0 p-2.5 rounded-xl bg-white border border-zinc-200 shadow-sm text-zinc-600 hover:bg-zinc-50 active:scale-95 transition-all" aria-label="Open menu">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <div class="min-w-0">
                  <p id="day-date-sub" class="text-sm text-zinc-500 font-medium"></p>
                  <h1 id="day-name-label" class="text-3xl sm:text-4xl font-bold text-zinc-900 tracking-tight">Monday</h1>
                </div>
              </div>
              <button id="btn-back-week" type="button" class="touch-target px-6 py-3 rounded-2xl bg-white border border-zinc-200 shadow-sm text-base font-semibold text-zinc-700 hover:shadow-md active:scale-[0.98] transition-all elevate-hover">week</button>
            </div>
            <div id="day-user-strip-mobile" class="flex sm:hidden gap-2 mt-4 overflow-x-auto pb-1"></div>
          </header>
          <main id="day-timeline" class="flex-1 px-4 sm:px-8 py-6 overflow-y-auto scrollbar-thin space-y-3"></main>
        </div>
      </div>

      <div id="view-month" class="view-container hidden min-h-screen flex max-w-[1400px] mx-auto w-full">
        <aside id="month-week-strip" class="hidden md:flex flex-col gap-2 p-3 border-r border-zinc-200 bg-white/80 shrink-0"></aside>
        <div class="flex-1 flex flex-col min-w-0">
          <header class="sticky top-0 z-30 glass-panel border-b border-zinc-200 px-4 sm:px-6 py-4">
            <div class="flex items-center justify-between gap-3 mb-4">
              <div class="flex items-center gap-3 min-w-0">
                <button type="button" data-sidebar-toggle class="md:hidden touch-target shrink-0 p-2.5 rounded-xl bg-white border border-zinc-200 shadow-sm text-zinc-600 hover:bg-zinc-50 active:scale-95 transition-all" aria-label="Open menu">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h1 class="text-2xl sm:text-3xl font-display font-bold text-zinc-900">Calendar</h1>
              </div>
              <button id="btn-month-clear-filters" type="button" class="touch-target px-4 py-2.5 rounded-xl text-sm font-medium text-zinc-600 bg-white border border-zinc-200 shadow-sm hover:bg-zinc-50 active:scale-[0.98] transition-all elevate-hover">Clear Filters</button>
            </div>
            <div id="month-ribbon" class="flex gap-1 sm:gap-2 overflow-x-auto pb-1"></div>
            <div id="month-week-strip-mobile" class="flex md:hidden gap-2 mt-3 overflow-x-auto pb-1"></div>
          </header>
          <div class="flex flex-1 min-h-0">
            <aside id="month-user-strip" class="hidden sm:flex flex-col gap-2 p-3 border-r border-zinc-200 bg-white/80 shrink-0"></aside>
            <main class="flex-1 p-3 sm:p-6 overflow-auto">
              <div class="grid grid-cols-7 gap-1 sm:gap-2 mb-2">
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">M</div>
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">T</div>
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">W</div>
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">Th</div>
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">F</div>
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">S</div>
                <div class="text-center text-xs sm:text-sm font-semibold text-zinc-500 py-2">S</div>
              </div>
              <div id="month-grid" class="grid grid-cols-7 gap-1 sm:gap-2"></div>
            </main>
          </div>
          <div id="month-user-strip-mobile" class="flex sm:hidden gap-2 px-4 py-3 border-t border-zinc-200 overflow-x-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="./ui.js"></script>
</body>
</html>
